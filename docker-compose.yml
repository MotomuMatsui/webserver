services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: webserver-app:latest
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      # Flask honours X-Forwarded-* headers via ProxyFix (configured in app.py).
      FORWARDED_ALLOW_IPS: "*"
    # For Apple Silicon hosts, MMseqs2's cmake flags differ by arch; the
    # Dockerfile already patches Makefile.linux when TARGETARCH=arm64, so a
    # native arm64 build works. Uncomment only if you need an x86_64 build
    # (it will run under QEMU and be much slower):
    # platform: linux/amd64

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${BIND_PORT:-8080}:80"
    depends_on:
      - app
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Serve the same static assets the Flask container ships with, straight
      # from nginx. Read-only bind mount of the repo's static/ directory.
      - ./static:/app/static:ro
