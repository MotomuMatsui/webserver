upstream flask_app {
    server app:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # Match the Flask MAX_CONTENT_LENGTH (50 MB) so nginx does not reject
    # large FASTA uploads with 413 before they reach the app.
    client_max_body_size 50M;

    # Subprocess runs (gs2, panjep) can take minutes for large inputs.
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;
    proxy_connect_timeout 30s;

    # Static assets: serve directly from nginx, bypassing Flask.
    location /static/ {
        alias /app/static/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass         http://flask_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_buffering    off;
    }
}
